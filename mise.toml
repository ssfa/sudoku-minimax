[tools]
java = "21.0.2"
android-sdk = "latest"
gradle = "8.13"

[tasks.build]
description = "디버그 APK 빌드"
run = "mise exec -- ./gradlew exportDebugApk"

[tasks.install]
description = "연결된 기기에 APK 설치"
depends = ["build"]
run = "adb install -r app/build/outputs/apk/debug/app-debug.apk"

[tasks.launch]
description = "빌드·설치 후 앱 실행"
depends = ["install"]
run = "adb shell am start -W -n com.ssfa.sudoku.minimax/.MainActivity"

[tasks.setup]
description = "Android SDK 초기 환경 구성"
run = "yes | sdkmanager --licenses 2>/dev/null; sdkmanager --install \"platform-tools\" \"platforms;android-35\" \"build-tools;35.0.0\" \"emulator\""